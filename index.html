<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Master Liga Fut-Fera</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{margin:0;background:#050505;color:#fff;font-family:Arial}
header{padding:30px;text-align:center;background:linear-gradient(#ff6a00,#111)}
h1{color:#ff7a00}
.card{margin:16px;padding:16px;border:2px solid #ff6a00;border-radius:16px;background:#111}
.linha{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #333}
</style>
</head>

<body>
<header>
<h1>🐯 MASTER LIGA</h1>
<h2>FUT-FERA</h2>
</header>

<div class="card">
<h2>🏆 Ranking</h2>
<div id="ranking">Carregando...</div>
</div>

<script>
const supabase = window.supabase.createClient(
"https://xixcydnqddboqjboszue.supabase.co",
"sb_publishable_kRX4eWeihn-yw1PTGdFWyw_TKuePNEF"
);

async function carregar(){
const {data}=await supabase
.from("jogadores")
.select("*")
.order("pontos",{ascending:false});

let html="";
data.forEach((j,i)=>{
html+=`<div class="linha">
<b>${i+1}. ${j.nome}</b>
<span>${j.pontos}</span>
</div>`;
});
document.getElementById("ranking").innerHTML=html;
}
carregar();
</script>

</body>
</html>
