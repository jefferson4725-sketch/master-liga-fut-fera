<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Master Liga Fut-Fera</title>
<style>
body{margin:0;background:#0b0b0b;color:#fff;font-family:Arial}
.header{padding:36px 20px;text-align:center;background:linear-gradient(180deg,#ff6a00,#111)}
.logo{font-size:38px;font-weight:700;color:#ff7a00}.sub{font-size:22px}
.wrap{padding:18px}.btn{display:block;background:#ff6a00;color:#fff;text-decoration:none;padding:16px;border-radius:14px;margin:12px 0;font-weight:bold}
.box{background:#181818;border:2px solid #ff7a00;border-radius:16px;padding:18px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #333}
input{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:none}.hide{display:none}
</style></head><body>
<div class="header"><div class="logo">🐯 MASTER LIGA</div><div class="sub">FUT-FERA</div></div>
<div class="wrap"><div id="home" class="box"><h2>Bem-vindo</h2>
<a class="btn" onclick="show('rank')">🏆 Ranking</a>
<a class="btn" onclick="show('art')">⚽ Artilharia</a>
<a class="btn" onclick="show('part')">📅 Partidas</a></div>
<div id="rank" class="box hide"><h2>🏆 Ranking</h2><table><thead><tr><th>Jogador</th><th>Pts</th></tr></thead><tbody id="rankBody"></tbody></table><a class="btn" onclick="show('home')">⬅ Voltar</a></div>
<div id="art" class="box hide"><h2>⚽ Artilharia</h2><table><thead><tr><th>Jogador</th><th>Gols</th></tr></thead><tbody id="artBody"></tbody></table><a class="btn" onclick="show('home')">⬅ Voltar</a></div>
<div id="part" class="box hide"><h2>📅 Nova Partida</h2><input id="m" placeholder="Mandante"><input id="v" placeholder="Visitante"><input id="gm" type="number" placeholder="Gols mandante"><input id="gv" type="number" placeholder="Gols visitante"><a class="btn" onclick="salvar()">💾 Salvar</a><p id="msg"></p><a class="btn" onclick="show('home')">⬅ Voltar</a></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase=window.supabase.createClient("https://xixcydnqddboqjboszue.supabase.co","sb_publishable_kRX4eWeihn-yw1PTGdFWyw_TKuePNEF");
function show(id){["home","rank","art","part"].forEach(x=>document.getElementById(x).classList.add("hide"));document.getElementById(id).classList.remove("hide");if(id=="rank")loadRank();if(id=="art")loadArt();}
async function loadRank(){const {data}=await supabase.from("jogadores").select("*").order("pontos",{ascending:false});rankBody.innerHTML=(data||[]).map(j=>`<tr><td>${j.nome}</td><td>${j.pontos}</td></tr>`).join("")}
async function loadArt(){const {data}=await supabase.from("jogadores").select("*").order("gols",{ascending:false});artBody.innerHTML=(data||[]).map(j=>`<tr><td>${j.nome}</td><td>${j.gols}</td></tr>`).join("")}
async function salvar(){const m=document.getElementById("m").value,v=document.getElementById("v").value,gm=+document.getElementById("gm").value,gv=+document.getElementById("gv").value;await supabase.from("partidas").insert({mandante:m,visitante:v,gols_mandante:gm,gols_visitante:gv});msg.innerText="Partida salva!";}
</script></body></html>
